openapi: 3.0.3

info:
  title: forge-ci engine contract
  version: "1.0.0"
  description: >-
    What every forge-ci engine takes and returns.

    Spec, Resource, DeclareInput and DeclareOutput also appear in
    forge-revision-spec. That file is the contract between two tools, forge-ci
    and forge-factory, and holds only what both read. This one is the contract
    between forge-ci and the engines it calls. The four are repeated rather
    than shared across files, because an engine generates from one spec and a
    cross file reference would need a resolver that neither generator has.

paths: {}

components:
  schemas:
    Spec:
      type: object
      additionalProperties: true
      description: >-
        Engine specific configuration. forge-ci never reads inside it.

    Status:
      type: string
      enum: [pending, running, passed, failed]
      description: What a run or a gate came to.

    Resource:
      type: object
      description: Something an engine needs to exist. Declared by engines, realized by managers.
      required: [kind, name]
      properties:
        kind:
          type: string
          description: Resource kind, for example directory or table.
        name:
          type: string
          description: Unique name within the kind.
        bootstrapOnly:
          type: boolean
          description: >
            Realized by a bootstrap and never by an apply.

            For a resource that cannot be converged: a credential is written
            blind, because nothing can be read back to compare against, so
            "reconciling" one is just writing it again. Doing that on every
            run also means every run must hold the rights to rewrite it,
            which is a far wider blast radius than running a pipeline needs.

            Credentials are the case this exists for. Only a bootstrap is
            responsible for them.
        spec:
          $ref: '#/components/schemas/Spec'

    Ownership:
      type: object
      description: Which manager created a resource. A second manager must not touch it.
      required: [resource, manager]
      properties:
        resource:
          type: string
          description: Resource id, kind slash name.
        manager:
          type: string
          description: Alias of the manager that created it.

    DeclareInput:
      type: object
      description: >-
        What an engine is asked with when it reports what it needs. An engine
        declares before anything exists to name, so it carries the spec block
        and the pipeline root, and nothing else.
      properties:
        spec:
          $ref: '#/components/schemas/Spec'
        root:
          type: string
          description: >-
            The pipeline root on the local filesystem, for an engine whose
            spec names workspace files to read at declare time - a resolved
            pin a sync generated, for example. Optional, so an engine that
            reads nothing keeps validating without it.

    DeclareOutput:
      type: object
      description: What an engine needs to exist. An engine with no infrastructure returns an empty list.
      required: [resources]
      properties:
        resources:
          type: array
          items:
            $ref: '#/components/schemas/Resource'

    ReconcileInput:
      type: object
      description: What a manager is asked to make exist.
      required: [manager, resources]
      properties:
        manager:
          type: string
          description: Alias of the manager being asked.
        resources:
          type: array
          items:
            $ref: '#/components/schemas/Resource'
        owned:
          type: array
          items:
            $ref: '#/components/schemas/Ownership'
          description: What is already owned, so a manager refuses another's resource.
        bootstrap:
          type: boolean
          description: >
            Whether this is the provisioning ceremony.

            A resource marked bootstrapOnly is still handed over when this is
            false - the manager keeps owning it, which is what stops another
            manager claiming it - but the manager must not realize it.

            Credentials are the case. Only a bootstrap writes one.
        spec:
          $ref: '#/components/schemas/Spec'
        dryRun:
          type: boolean
          description: >
            Whether to answer what would happen and write nothing.

            A manager reads actual state exactly as it always does, reports
            the action it would take on each resource, and performs no write
            and no settle. It is the same code path as a real reconcile with
            the write suppressed, so a plan that says nothing would change is
            a promise the next run keeps.
        force:
          type: boolean
          description: >
            Whether to rewrite a resource that already exists but cannot be
            compared.

            Only a write-only resource needs this. The Actions secrets API
            never returns a value, so a put over an existing secret silently
            replaces whatever was there and two operators with different
            credentials leave one winner. Without this, an existing secret is
            left alone.

    ReconcileOutput:
      type: object
      description: What a manager made exist, and what it did.
      required: [owned, actions]
      properties:
        owned:
          type: array
          items:
            $ref: '#/components/schemas/Ownership'
        actions:
          type: array
          items:
            type: string
          description: One line per thing done, for a human reading a report.
        changed:
          type: boolean
          description: >
            Whether this manager found a difference between what was declared
            and what existed, and performed a change to close it.

            A caller stops the run when this is true. The change is already
            durable - a manager that needs a separate act to make it so has
            done that act by the time it answers - so the next run reads the
            corrected state and this is false.

            Not required. An older manager that never sets it reports false,
            which is the behaviour that predates the field.
        published:
          type: boolean
          description: >
            Whether the settle delivered the changes somewhere outside the
            machine that reconciled them - a git push. The caller's stop
            decision hangs on it: a published change re-fires the pipeline,
            so a run may stop superseded by the run the push triggers; a
            change nobody published cannot re-trigger anything, and a run
            that stopped for one would strand the pipeline forever.

            Not required. An older manager that never sets it reports false,
            and a caller then continues past its changes rather than
            stopping for a run that will never come.

    TriggerOutput:
      type: object
      description: Whether the watched repos moved since the last fingerprint.
      required: [changed, fingerprint]
      properties:
        changed:
          type: boolean
        reason:
          type: string
        fingerprint:
          type: string
          description: Opaque. Handed back on the next poll as spec.previous.

    RepoCheckout:
      type: object
      description: One repo as the compute engine sees it.
      required: [name, path, sha]
      properties:
        name:
          type: string
        path:
          type: string
        sha:
          type: string
        needs:
          type: array
          items:
            type: string
          description: >-
            Repos that must finish before this one starts, when a target runs
            in both. A compute engine groups a target's dirs into waves from
            these edges and runs a wave at once. With none declared every dir
            is its own wave, in the order given, which is one at a time.

    Target:
      type: object
      description: One thing to run. Either a forge target or a forge-ci verb, never both.
      required: [alias]
      properties:
        alias:
          type: string
        forge:
          type: string
          description: A forge target, run in each repo named by in.
        forgeCI:
          type: string
          description: A forge-ci verb, run at the workspace root.
        in:
          type: array
          items:
            type: string

    ForgeResult:
      type: object
      additionalProperties: true
      description: >-
        forge's own TestReport and Artifact records, carried verbatim. Their
        schema lives in forge and is not repeated here, because a copy drifts
        from what forge actually emits.

    ForgeArtifact:
      type: object
      additionalProperties: true
      description: >-
        One artifact record from forge, carried verbatim. Its schema lives in
        forge for the same reason ForgeResult's does.

    RunInput:
      type: object
      description: What a compute engine is asked to run.
      required: [revision, stage, substage, targets, root]
      properties:
        revision:
          type: string
        version:
          type: string
          description: >-
            The number this apply would release under, derived before the
            first stage. A compute target stamps it into what it builds, so a
            binary reports the release it shipped in rather than the nearest
            tag its own repo happens to carry. Absent when the pipeline
            releases nothing.
        stage:
          type: string
        substage:
          type: string
        sync:
          type: boolean
          description: >-
            Converge the workspace before any target runs - manifests first,
            then the dependency closure. On the wire rather than a core
            shell-out because the machine that must converge is the one the
            engine runs targets on; a remote runner is never reached by
            anything the core executes.
        targets:
          type: array
          items:
            $ref: '#/components/schemas/Target'
        params:
          type: object
          additionalProperties:
            type: string
          description: User defined values, templated into the targets.
        repos:
          type: array
          items:
            $ref: '#/components/schemas/RepoCheckout'
        root:
          type: string
        spec:
          $ref: '#/components/schemas/Spec'

    RunOutput:
      type: object
      description: What a compute engine came back with.
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/Status'
        message:
          type: string
        output:
          type: string
          description: The tail of what the command printed, kept for a failure.
        forge:
          $ref: '#/components/schemas/ForgeResult'

    GateResult:
      type: object
      description: What one gate decided.
      required: [alias, status]
      properties:
        alias:
          type: string
        status:
          $ref: '#/components/schemas/Status'
        message:
          type: string

    Run:
      type: object
      description: One substage that ran, and what came of it.
      required: [revision, stage, substage, engine, status, startedAt, duration]
      properties:
        revision:
          type: string
        stage:
          type: string
        substage:
          type: string
        engine:
          type: string
        status:
          $ref: '#/components/schemas/Status'
        startedAt:
          type: string
          format: date-time
        duration:
          type: number
          description: Seconds.
        message:
          type: string
        output:
          type: string
        forge:
          $ref: '#/components/schemas/ForgeResult'
        gates:
          type: array
          items:
            $ref: '#/components/schemas/GateResult'

    GateInput:
      type: object
      description: A gate judges a run after it finished. A gate never runs before.
      required: [run]
      properties:
        run:
          $ref: '#/components/schemas/Run'
        spec:
          $ref: '#/components/schemas/Spec'

    PromotionInput:
      type: object
      description: Whether a stage advances, decided once over every substage outcome.
      required: [stage, runs]
      properties:
        stage:
          type: string
        runs:
          type: array
          items:
            $ref: '#/components/schemas/Run'
        spec:
          $ref: '#/components/schemas/Spec'

    PromotionOutput:
      type: object
      description: The decision, and why.
      required: [advance, reason]
      properties:
        advance:
          type: boolean
        reason:
          type: string

    ArtifactInput:
      type: object
      description: What a release engine is handed once a stage proved a revision.
      required: [revision, version]
      properties:
        revision:
          type: string
          description: The revision being released.
        version:
          type: string
          description: >-
            The semver tag to publish under. Decided by the core and by
            nothing else. An engine that computes its own is a second
            authority, and two authorities is how every member of a workspace
            drifted onto a version line of its own.
        tagPrefix:
          type: string
          description: >-
            Namespaces the tag when one repo is released by more than one
            factory. Absent means the tag is the version.
        repos:
          type: object
          additionalProperties:
            type: string
          description: Repo name to commit SHA.
        artifacts:
          type: array
          items:
            $ref: '#/components/schemas/ForgeArtifact'
          description: What forge built.
        spec:
          $ref: '#/components/schemas/Spec'

    ArtifactOutput:
      type: object
      description: What reached the outside world.
      required: [published]
      properties:
        published:
          type: boolean
        url:
          type: string
        reason:
          type: string
        tagged:
          type: array
          items:
            type: string
          description: Repos that carry the tag now.
