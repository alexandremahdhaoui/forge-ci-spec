$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://github.com/alexandremahdhaoui/forge-ci-spec/spec/forge-ci.v1.yaml"
title: pipeline
description: >-
  A forge-ci pipeline. Declares which repos form a revision, which engines and
  managers exist, and the ordered stages a revision moves through.
type: object
additionalProperties: false
required: [name, engines, state, stages]

properties:
  versioning:
    type: object
    additionalProperties: false
    description: >-
      How the one number this factory releases under is derived. Every member
      is tagged with it, so a workspace has one version line rather than one
      per repo. There is no field to type a version into: a version is derived
      or it is nothing, so it can never be re-pointed at a release that
      already exists.
    properties:
      tagPrefix:
        type: string
        pattern: "^[a-z0-9][a-z0-9-]*$"
        description: >-
          Goes in front of the semver, joined with a dash. Absent means no
          prefix, which is what every factory does: v0.50.0. Set it only when
          one repo is released by more than one factory, so the two lines do
          not read each other's tags.
      strategy:
        type: string
        enum: [bump-patch-version, bump-minor-version, semantic]
        description: >-
          Which number moves. Absent means bump-patch-version.
      cap:
        type: string
        pattern: "^v(0|[1-9][0-9]*)(\\.(0|[1-9][0-9]*))?$"
        description: >-
          The ceiling the bump may not cross, inclusive. "v0" holds the major
          at 0; "v0.50" holds major and minor. A bump that would cross it
          drops one level and retries, so a factory that is not ready for v1
          keeps releasing rather than stopping. A full semver is refused: a
          cap on the patch would stop the only bump that always works.
      semantic:
        type: object
        additionalProperties: false
        description: >-
          The vocabulary the semantic strategy reads commit subjects with. It
          is a vocabulary and not a standard: a team writes the prefixes it
          actually uses, emoji included. Ignored by the other strategies.
        properties:
          major:
            type: array
            items: {type: string}
          minor:
            type: array
            items: {type: string}
          patch:
            type: array
            items: {type: string}
          ignore:
            type: array
            items: {type: string}
          unmatched:
            type: string
            enum: [major, minor, patch, ignore, error]
            description: >-
              What a subject no list claims scores. Absent means patch. Set it
              to ignore to make the vocabulary exhaustive, or to error to
              enforce it: the newest commit of each release repo must then
              match a list, or the run fails before anything builds, naming
              the subject. Older unmatched commits score patch, because the
              fix is a good commit on top and never a rewritten history.
      ignorePaths:
        type: array
        items: {type: string}
        description: >-
          Paths whose changes never release, as glob patterns against each
          member's root. A revision whose release set differs from the last
          release only under these paths converges without a release. List
          only what nothing embeds: a README a binary carries is a code
          change, and a pattern that hides it hides a release.
      selfReconcileCommitPrefix:
        type: string
        minLength: 1
        description: >-
          What the commit forge-ci writes when it reconciles its own CI
          resources starts with. Absent means "forge-ci:", so the commit
          reads "forge-ci: self reconcile". The release decision scores that
          commit as a patch unless a semantic list names the same prefix,
          in which case that list wins.
  name:
    type: string
    minLength: 1
    description: Pipeline identifier.

  artifactStorePath:
    type: string
    description: Where forge-ci records its own artifacts.

  repos:
    type: array
    description: >-
      The repos that form a revision. Optional. One repo is valid. A pipeline
      with no repos still runs, and its revision is the pipeline file itself.
    items:
      type: object
      additionalProperties: false
      required: [name, url]
      properties:
        name:
          type: string
          minLength: 1
        url:
          type: string
          minLength: 1
        ref:
          type: string
          default: main
          description: Branch to track.

  managers:
    type: array
    description: >-
      Named manager instances. A manager makes declared resources exist. It
      knows nothing about CI.
    items:
      type: object
      additionalProperties: false
      required: [alias, engine]
      properties:
        alias:
          $ref: "#/$defs/alias"
        engine:
          $ref: "#/$defs/engineURI"
        spec:
          type: object
          description: Manager specific configuration. Validated by the manager.

  engines:
    type: array
    minItems: 1
    description: >-
      Named engine instances. An engine implements one port. It declares the
      resources it needs and never names a manager kind.
    items:
      type: object
      additionalProperties: false
      required: [alias, type, engine, manager]
      properties:
        alias:
          $ref: "#/$defs/alias"
        type:
          $ref: "#/$defs/port"
        engine:
          $ref: "#/$defs/engineURI"
        manager:
          $ref: "#/$defs/alias"
          description: Alias of an entry in managers.
        spec:
          type: object
          description: Engine specific configuration. Validated by the engine.

  state:
    $ref: "#/$defs/alias"
    description: Alias of the engine whose type is state.

  triggers:
    type: array
    description: Aliases of engines whose type is trigger.
    items:
      $ref: "#/$defs/alias"

  targets:
    type: array
    description: >-
      Named units of work. A target names a forge target or a forge-ci verb.
      This is the only place a forge target appears.
    items:
      type: object
      additionalProperties: false
      required: [alias]
      oneOf:
        - required: [forge]
        - required: [forgeCI]
      properties:
        alias:
          $ref: "#/$defs/alias"
        forge:
          type: string
          minLength: 1
          description: Arguments passed to forge. For example "test-all".
        forgeCI:
          type: string
          minLength: 1
          description: A forge-ci verb. For example "apply".
        in:
          type: array
          description: >-
            Repo names the target runs in. Empty means the pipeline root.
          items:
            type: string

  stages:
    type: array
    minItems: 1
    description: >-
      Ordered phases. A revision moves through them left to right. There is no
      dependency graph. Order is list order.
    items:
      type: object
      additionalProperties: false
      required: [name, substages]
      properties:
        name:
          $ref: "#/$defs/alias"
        mint:
          type: boolean
          description: >-
            Write the revision to state when this stage advances. A revision is
            a claim that this tuple of commits was proven, so minting it before
            anything runs hands a broken build a revision that can propagate.
            Set it on the stage that builds and tests. Left unset on every
            stage, nothing is ever minted.
        release:
          $ref: "#/$defs/alias"
          description: >-
            Alias of an engine whose type is artifact. It runs after the stage
            advances, so nothing is published for a build that did not pass.
        releaseRepos:
          type: array
          items:
            type: string
            minLength: 1
          description: >-
            The repos this stage's release publishes. Only these reach the
            artifact engine, so only these are tagged. Empty or absent means
            every repo. Each name must be a declared repo and must not
            repeat, and the key needs a release engine on the same stage -
            both checked in the semantic pass, since they cross-reference.
        promotion:
          $ref: "#/$defs/alias"
          description: >-
            Alias of an engine whose type is promotion. It decides whether the
            stage advances, given every substage outcome.
        substages:
          type: array
          minItems: 1
          description: >-
            Independent units inside a stage. They run at the same time.
          items:
            type: object
            additionalProperties: false
            required: [name, engine, manager, targets]
            properties:
              name:
                $ref: "#/$defs/alias"
              engine:
                $ref: "#/$defs/alias"
              manager:
                $ref: "#/$defs/alias"
              targets:
                type: array
                minItems: 1
                items:
                  $ref: "#/$defs/alias"
              gates:
                type: array
                description: >-
                  Aliases of engines whose type is gate. Every gate runs after
                  the substage finishes. A gate never runs before.
                items:
                  $ref: "#/$defs/alias"
              params:
                type: object
                description: >-
                  User defined keys, templated into the targets as {{.Params.x}}.
                  forge-ci never interprets these names.
                additionalProperties:
                  type: string
              sync:
                type: boolean
                description: >-
                  Converge the workspace before this substage's targets run -
                  manifests first, then the dependency closure. A multi-repo
                  pipeline must set it on at least one substage; that rule is
                  semantic and checked in a second pass.

$defs:
  alias:
    type: string
    pattern: "^[a-z0-9][a-z0-9-]*$"
    description: Lowercase kebab-case identifier.

  port:
    type: string
    enum: [compute, state, trigger, gate, promotion, artifact]
    description: The question an engine answers.

  engineURI:
    type: string
    pattern: "^(forge|alias)://.+"
    description: >-
      Only forge:// and alias:// resolve. Anything else is a hard error, matching
      forge.
